<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Little Lemon{% endblock %}</title>
  <style>
    :root { color-scheme: light; --green:#495e57; --yellow:#f4ce14; --ink:#24332e; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,sans-serif; color:var(--ink); background:#f7f7f2; }
    header { background:var(--green); color:white; padding:18px 24px; }
    header .nav { max-width:1000px; margin:auto; display:flex; justify-content:space-between; align-items:center; gap:18px; }
    header a { color:white; text-decoration:none; margin-left:16px; font-weight:600; }
    .brand { font-weight:800; font-size:1.25rem; }
    main { max-width:1000px; margin:34px auto; padding:0 20px; }
    .panel { background:white; border-radius:18px; padding:clamp(20px,4vw,36px); box-shadow:0 8px 28px #24332e12; }
    h1 { margin-top:0; color:var(--green); }
    label { display:block; margin:16px 0 7px; font-weight:650; }
    input, select { width:100%; padding:12px; border:1px solid #cbd3ce; border-radius:9px; font:inherit; background:white; }
    button, .button { border:0; border-radius:9px; background:var(--yellow); color:#24332e; font-weight:750; padding:12px 18px; cursor:pointer; text-decoration:none; display:inline-block; margin-top:18px; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .muted { color:#62716b; }
    .message { margin-top:16px; font-weight:600; }
    .error { color:#a52828; } .success { color:#246a40; }
    table { width:100%; border-collapse:collapse; margin-top:18px; }
    th,td { padding:11px; text-align:left; border-bottom:1px solid #e3e8e4; }
    pre { white-space:pre-wrap; overflow-wrap:anywhere; background:#f2f5f2; padding:14px; border-radius:10px; }
    footer { text-align:center; padding:26px; color:#62716b; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
<header><div class="nav"><a class="brand" href="/">Little Lemon</a><nav><a href="/book/">Book a table</a><a href="/reservations/">Reservations</a></nav></div></header>
<main>{% block content %}{% endblock %}</main>
<footer>Little Lemon · Reservation demo</footer>
{% block scripts %}{% endblock %}
</body>
</html>
